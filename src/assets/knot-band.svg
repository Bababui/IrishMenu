<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 20" width="32" height="20" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- One repeating tile of a two-strand Celtic plait (ribbon style).
       Masks cut the "under" strand at each crossing and hollow out the ribbons. -->
  <defs>
    <clipPath id="cross-mid"><rect x="10.5" y="0" width="11" height="20"/></clipPath>
    <clipPath id="cross-edge"><rect x="-1" y="0" width="6" height="20"/><rect x="27" y="0" width="6" height="20"/></clipPath>
    <mask id="mask-a" maskUnits="userSpaceOnUse" x="-2" y="-2" width="36" height="24">
      <rect x="-2" y="-2" width="36" height="24" fill="#fff"/>
      <path d="M0 10 C2 6.5 5 4 8 4 C11 4 14 6.5 16 10 C18 13.5 21 16 24 16 C27 16 30 13.5 32 10" stroke="#000" stroke-width="1.3" fill="none"/>
      <path d="M0 10 C2 13.5 5 16 8 16 C11 16 14 13.5 16 10 C18 6.5 21 4 24 4 C27 4 30 6.5 32 10" stroke="#000" stroke-width="6.2" fill="none" clip-path="url(#cross-edge)"/>
    </mask>
    <mask id="mask-b" maskUnits="userSpaceOnUse" x="-2" y="-2" width="36" height="24">
      <rect x="-2" y="-2" width="36" height="24" fill="#fff"/>
      <path d="M0 10 C2 13.5 5 16 8 16 C11 16 14 13.5 16 10 C18 6.5 21 4 24 4 C27 4 30 6.5 32 10" stroke="#000" stroke-width="1.3" fill="none"/>
      <path d="M0 10 C2 6.5 5 4 8 4 C11 4 14 6.5 16 10 C18 13.5 21 16 24 16 C27 16 30 13.5 32 10" stroke="#000" stroke-width="6.2" fill="none" clip-path="url(#cross-mid)"/>
    </mask>
  </defs>
  <g fill="none" stroke="#d2a646">
    <path d="M0 10 C2 6.5 5 4 8 4 C11 4 14 6.5 16 10 C18 13.5 21 16 24 16 C27 16 30 13.5 32 10" stroke-width="3.6" mask="url(#mask-a)"/>
    <path d="M0 10 C2 13.5 5 16 8 16 C11 16 14 13.5 16 10 C18 6.5 21 4 24 4 C27 4 30 6.5 32 10" stroke-width="3.6" mask="url(#mask-b)"/>
    <path d="M0 .6H32M0 19.4H32" stroke-width="1"/>
  </g>
</svg>
